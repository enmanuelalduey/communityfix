<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CommunityFix</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>
<body>
    <div class="contenedor">
        <div class="cabecera">
            <div class="logo">
                <img src="img/logo.png" alt="CommunityFix">

            </div>
              <h1>Community<span>Fix</span></h1>

              <p class="eslogan">
                Juntos hacemos nuestra comunidad mejor
            </p>

            </div>

            <div class="login-card">
               
            <h2>Iniciar Sesión</h2>

            <p class="texto">
                Accede para reportar y dar seguimiento a los problemas de tu comunidad
            </p>

            <form>
                  <label>Correo electrónico</label>
                  <div class="input-group">
                   <i class="fa-solid fa-envelope"></i>
                  <input type="email" placeholder="usuario@ejemplo.com">
                </div>

                   <label>Contraseña</label>
                  <div class="input-group">
                   <i class="fa-solid fa-lock"></i>
                   <input type="password" placeholder="********">
                </div>

                 <a href="#" class="olvido">
                    ¿Olvidaste tu contraseña?
                 </a>

                 <a href="dashboard.html" class="btn-login">
                  Iniciar Sesión
                 </a>

                 <div class="separador">o</div>

                 <a href="registro.html" class="btn-registro">
                  Registrarse
                 </a>
                 
              </form>

              <p class="contacto">
                ¿Tienes problemas? <a href="#">Contáctanos</a>
              </p>
        </div>

        </div>
      
</body>
</html>
